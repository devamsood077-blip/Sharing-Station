<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sharing Station</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      cursor: default;
    }
    img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 48px;
      text-align: center;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .status span {
      display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <img src="splash.png" alt="" />
  <div class="status"><span>Loading Sharing Station</span></div>
</body>
</html>
